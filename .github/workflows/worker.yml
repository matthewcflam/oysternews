# The ingestion run (HANDOFF.md §3.2, §3.5).
#
# §6 decision 3: `schedule` only, no third-party cron trigger. That drops a
# service and a never-rotating `actions: write` PAT, at the cost of one thing
# worth knowing — **GitHub disables scheduled workflows after 60 days of
# repository INACTIVITY**, not 60 days of elapsed time. A monthly calendar
# reminder covers it; a commit of any kind resets the clock.
#
# Twice a day over a rolling 24-hour window, 48 for tier-1 (§3.5). 16:20 UTC is
# 9:20am Pacific and 04:20 UTC is 9:20pm the evening before — PINNED TO PDT, so
# both land an hour earlier once PST starts in November. That drift is accepted;
# correcting it is a one-line seasonal edit, not something to engineer around.
#
# The offset minute is deliberate: scheduled workflows queue heavily on the hour,
# and GDELT publishes at :00/:15/:30/:45, so :20 asks for a bundle that has
# finished being written.
#
# 48 bundles accumulate between runs but fetch.ts caps at MAX_BUNDLES = 12,
# newest-first, so a run ingests the newest 3 hours and skips the rest. The
# window is deliberately SAMPLED — 6 of every 24 hours of news, in two blocks.
# See docs/DESIGN.md#pipeline.
name: worker

on:
  schedule:
    - cron: "20 4,16 * * *"
  workflow_dispatch:
    inputs:
      bundle_cap:
        description: "Bundles to fetch (default 12). Lower it for a smoke run."
        required: false
        type: string

# A run reads the shard pool, appends to it, and prunes it. Two overlapping runs
# would each prune against their own view of the window. Serialize rather than
# reason about it — and never cancel a run mid-publish.
concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

# The tippecanoe built below. It is not the minimum — the minimum is 2.52.0 and
# lives in scripts/run-tippecanoe.sh, which is the one place that enforces it.
# This is just which version above the floor CI happens to pin.
env:
  TIPPECANOE_VERSION: "2.79.0"

jobs:
  run:
    runs-on: ubuntu-latest
    # A 12-bundle recovery run is the worst case: ~60 MB of downloads plus a
    # tippecanoe pass over ~40,700 features. 20 minutes is generous for that and
    # still bounds a hung fetch against the free Actions allowance.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # **This was `apt-get install tippecanoe` until 2026-08-14, and that is
      # what broke the density budget.** Ubuntu 24.04 ships 2.49.0, which
      # silently drops every feature carrying an explicit `tippecanoe.minzoom` —
      # i.e. every feature this project publishes — leaving one feature per tile
      # while still exiting 0. Fixed upstream in 2.52.0; the floor is enforced by
      # scripts/tippecanoe-min-version.sh, which has the mechanism. So this is a
      # pinned source build, and it cannot go back to apt until apt catches up.
      #
      # The cache key is the version, so a bump rebuilds and a rerun does not.
      # Cold build is ~2 min on a 4-core runner; warm is a restore.
      - name: Cache tippecanoe ${{ env.TIPPECANOE_VERSION }}
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tippecanoe ${{ env.TIPPECANOE_VERSION }}
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" \
            https://github.com/felt/tippecanoe /tmp/tippecanoe-src
          make -C /tmp/tippecanoe-src -j"$(nproc)"
          mkdir -p ~/.local/bin
          cp /tmp/tippecanoe-src/tippecanoe \
             /tmp/tippecanoe-src/tippecanoe-decode \
             /tmp/tippecanoe-src/tile-join ~/.local/bin/

      # Runs on a cache restore as well as a cold build: a restored binary still
      # has to find libsqlite3 at runtime, and this is what turns that into a
      # failed step rather than a confusing archive twenty minutes later.
      #
      # Routed through run-tippecanoe.sh rather than calling the guard directly,
      # so the floor is not written down twice and this exercises the exact entry
      # point worker/tiles.ts uses.
      - name: Check the tippecanoe version
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" bash scripts/run-tippecanoe.sh --version

      - run: npm ci

      # Node runs the TypeScript directly (§0). worker/tiles.ts shells into
      # scripts/run-tippecanoe.sh by a repo-relative path, which resolves because
      # Actions sets the working directory to the workspace root.
      - name: Run the pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          BUNDLE_CAP: ${{ inputs.bundle_cap }}
        run: node worker/run.ts

      # The archive is already in R2; this is for reading a failed run without
      # re-running it. Kept short because it is debugging material, not a backup.
      - name: Upload the archive on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: stories-pmtiles-${{ github.run_id }}
          path: build/stories.pmtiles
          retention-days: 3
          if-no-files-found: ignore
