# GitHub disables scheduled workflows after 60 days of repository inactivity; any commit resets it.
# Pinned to PDT (9:20am/pm, an hour earlier under PST). :20 dodges the on-the-hour queue and half-written bundles.
name: worker

on:
  schedule:
    - cron: "20 4,16 * * *"
  workflow_dispatch:
    inputs:
      bundle_cap:
        description: "Bundles to fetch (default 12). Lower it for a smoke run."
        required: false
        type: string

# Never cancel a run mid-publish, and never let two runs prune against different views of the pool.
concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

# Which version CI pins, not the floor: the 2.52.0 minimum is enforced in scripts/run-tippecanoe.sh.
env:
  TIPPECANOE_VERSION: "2.79.0"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # A pinned source build, not apt: Ubuntu 24.04's apt ships 2.49.0, below the 2.52.0 floor.
      - name: Cache tippecanoe ${{ env.TIPPECANOE_VERSION }}
        id: tippecanoe-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tippecanoe ${{ env.TIPPECANOE_VERSION }}
        if: steps.tippecanoe-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" \
            https://github.com/felt/tippecanoe /tmp/tippecanoe-src
          make -C /tmp/tippecanoe-src -j"$(nproc)"
          mkdir -p ~/.local/bin
          cp /tmp/tippecanoe-src/tippecanoe \
             /tmp/tippecanoe-src/tippecanoe-decode \
             /tmp/tippecanoe-src/tile-join ~/.local/bin/

      # Runs on a cache restore too: a restored binary still has to find libsqlite3 at runtime.
      - name: Check the tippecanoe version
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" bash scripts/run-tippecanoe.sh --version

      - run: npm ci

      - name: Run the pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          BUNDLE_CAP: ${{ inputs.bundle_cap }}
        run: node worker/run.ts

      - name: Upload the archive on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: stories-pmtiles-${{ github.run_id }}
          path: build/stories.pmtiles
          retention-days: 3
          if-no-files-found: ignore
